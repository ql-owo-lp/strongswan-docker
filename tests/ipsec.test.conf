# This is a test ipsec.conf file
conn %default
    keyexchange=ikev2
    ikelifetime=24h
    keylife=1h
    keyingtries=%forever

conn vpn-main
    # Main VPN connection
    leftsubnet = 192.168.0.0/16
    rightsubnet=10.10.1.0/24
    auto = start
    reqid = 1

conn vpn-backup
    # Backup VPN with the same subnet but different reqid
    leftsubnet = 192.168.0.0/16
    rightsubnet = 10.10.1.0/24
    auto = start
    reqid = 2
conn vpn-other
    leftsubnet =192.168.0.0/16
    rightsubnet= 10.10.2.0/24
    auto=start
