# This is a test ipsec.conf file
conn %default
    keyexchange=ikev2
    ikelifetime=24h
    keylife=1h
    keyingtries=%forever

conn vpn-main
    # Main VPN connection
    left=192.168.0.1
    right=10.10.1.1
    leftsubnet = 192.168.0.0/16
    rightsubnet=10.10.1.0/24
    auto = start
    reqid = 1
    # Legacy mode (no mark)

conn vpn-backup
    # Backup VPN with the same subnet but different reqid
    left=192.168.0.1
    right=10.10.1.1
    leftsubnet = 192.168.0.0/16
    rightsubnet = 10.10.1.0/24
    auto = start
    reqid = 2

conn vpn-other
    left=192.168.0.1
    right=10.10.2.1
    leftsubnet =192.168.0.0/16
    rightsubnet= 10.10.2.0/24
    auto=start

# New Tunnel Case
conn oci-tunnel-1
    # Specific configuration for VTI
    mark=10
    left=1.2.3.4
    right=5.6.7.8
    # Local side: Usually 0.0.0.0/0 is fine here for VTI to allow any local container to talk
    leftsubnet=0.0.0.0/0
    # Remote side: BE SPECIFIC. This controls the route created by the script.
    rightsubnet=172.31.0.0/21
    auto=start

conn test-add
    left=1.1.1.1
    right=2.2.2.2
    leftsubnet=1.1.1.0/24
    rightsubnet=2.2.2.0/24
    auto=add

conn test-route
    left=3.3.3.3
    right=4.4.4.4
    leftsubnet=3.3.3.0/24
    rightsubnet=4.4.4.0/24
    auto=route

conn test-ignore
    left=5.5.5.5
    right=6.6.6.6
    leftsubnet=5.5.5.0/24
    rightsubnet=6.6.6.0/24
    auto=ignore
