config setup
    charondebug="ike 1, knl 1, cfg 0"

conn %default
    keyexchange=ikev2
    ikelifetime=24h
    keylife=1h
    keyingtries=%forever
    authby=secret
    mobike=no

# Client (Local) Configuration
# Initiates connections to the server.

conn net-1
    left=172.20.0.20
    leftid=client
    leftsubnet=192.168.0.0/16
    right=172.20.0.10
    rightid=server
    rightsubnet=10.10.0.0/16
    auto=start
    mark=10

conn net-2
    left=172.20.0.20
    leftid=client
    leftsubnet=192.168.0.0/16
    right=172.20.0.11
    rightid=server
    rightsubnet=10.10.0.0/16
    auto=start
    mark=20
