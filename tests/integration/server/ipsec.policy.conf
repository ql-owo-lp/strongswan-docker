config setup
    charondebug="ike 1, knl 1, cfg 0"

conn %default
    keyexchange=ikev2
    ikelifetime=24h
    keylife=1h
    keyingtries=%forever
    authby=secret
    mobike=no

# Policy-based test connection
conn net-policy
    left=172.20.0.10
    leftid=server
    leftsubnet=10.10.0.0/16
    right=172.20.0.20
    rightid=client
    rightsubnet=192.168.0.0/16
    auto=start
    # No mark = Policy based
