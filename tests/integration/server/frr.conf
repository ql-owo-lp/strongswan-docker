!
! Server FRR Configuration (AS 65000)
!
password zebra
enable password zebra
!
log file /var/log/frr/frr.log
!
router bgp 65000
 bgp router-id 1.1.1.1
 ! Peer with Client (IP on VTI)
 neighbor 192.168.0.1 remote-as 65001
 neighbor 192.168.0.1 description Client
 !
 address-family ipv4 unicast
  network 10.10.0.0/16
 exit-address-family
!
line vty
!
