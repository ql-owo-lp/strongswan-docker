config setup
    charondebug="ike 1, knl 1, cfg 0"

conn %default
    keyexchange=ikev2
    ikelifetime=24h
    keylife=1h
    keyingtries=%forever
    authby=secret
    mobike=no

# Server (Remote) Configuration
# It accepts connections from the client.

conn net-1
    left=172.20.0.10
    leftid=server
    leftsubnet=10.10.0.0/16
    right=172.20.0.20
    rightid=client
    rightsubnet=192.168.0.0/16
    auto=start
    mark=10

conn net-2
    left=172.20.0.11
    leftid=server
    leftsubnet=10.10.0.0/16
    right=172.20.0.20
    rightid=client
    rightsubnet=192.168.0.0/16
    auto=add
    mark=20
