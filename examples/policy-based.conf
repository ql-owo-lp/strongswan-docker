# Example Policy-Based IPsec Configuration
# This configuration uses standard XFRM policies without VTI interfaces.
# It is suitable for simple site-to-site VPNs where you don't need a routable interface.

config setup
    charondebug="ike 1, knl 1, cfg 0"

conn %default
    keyexchange=ikev2
    ikelifetime=24h
    keylife=1h
    keyingtries=%forever
    authby=secret
    mobike=no

conn policy-site-to-site
    # Local Side
    left=192.168.0.1           # Public IP of this server
    leftid=@moon.strongswan.org # ID of this server
    leftsubnet=10.1.0.0/24     # Local private subnet behind this server
    
    # Remote Side
    right=1.2.3.4              # Public IP of remote server
    rightid=@sun.strongswan.org # ID of remote server
    rightsubnet=10.2.0.0/24    # Remote private subnet behind remote server
    
    auto=start
