# Example VTI-Based IPsec Configuration
# This configuration uses VTI (Virtual Tunnel Interface) for route-based VPN.
# The 'mark' keyword is critical here - it tells the entrypoint script to create a vti interface.

config setup
    charondebug="ike 1, knl 1, cfg 0"

conn %default
    keyexchange=ikev2
    ikelifetime=24h
    keylife=1h
    keyingtries=%forever
    authby=secret
    mobike=no

conn vti-site-to-site
    # VTI requires a mark. The entrypoint will create 'vti10' for mark=10.
    mark=10
    
    # Local Side
    left=192.168.0.1
    leftid=@moon.strongswan.org
    leftsubnet=0.0.0.0/0       # For VTI, we often use 0.0.0.0/0 to allow any traffic routed to the interface
    
    # Remote Side
    right=1.2.3.4
    rightid=@sun.strongswan.org
    rightsubnet=10.2.0.0/24    # The remote subnet. The entrypoint will add a route to this via vti10.
    
    auto=start
