# Docker Compose file version
version: "3.9"

services:
  # Define the strongswan service
  strongswan:
    # This image is published to the GitHub Container Registry (ghcr.io).
    # You can also build it locally using the 'build-docker.sh' script.
    image: ghcr.io/ql-owo-lp/strongswan-docker:latest
    container_name: ipsec-gateway
    
    # Always restart the container if it stops, for high availability.
    restart: always
    
    # Mount the configuration files from the host NAS into the container.
    # The strongswan installation inside the Alpine container expects these files in /etc/.
    volumes:
      - ./ipsec.conf:/etc/ipsec.conf
      - ./ipsec.secrets:/etc/ipsec.secrets
      
    # Grant the container full access to the host's devices and processes.
    # This is a significant security risk, but is required on some systems
    # where granular capabilities (like SYS_ADMIN) are not sufficient to
    # modify host kernel parameters like net.ipv4.ip_forward.
    privileged: true
      
    # Use the host's network stack directly. This is the simplest and most
    # effective way for a VPN gateway container to function, as it avoids
    # complex port mapping and network address translation (NAT) issues.
    network_mode: "host"

    # Pass environment variables to the container to configure the network settings.
    # These variables are used by the entrypoint.sh script to set up iptables.
    # Update these values to match your specific network environment.
    environment:
      - LOCAL_NET=192.168.0.0/16
      - VPN_SUBNET=10.10.0.0/24
      - OUT_INTERFACE=eth0
