# This file controls the settings for the strongSwan charon daemon.
# https://wiki.strongswan.org/projects/strongswan/wiki/strongswanconf

charon {
  # Number of worker threads to use. 4 is a sensible default.
  threads = 16

  # Enable logging of more details for specific subsystems.
  # This is extremely useful for debugging connection issues.
  # You can increase the number for more verbosity (e.g., 2 or 3).
  filelog {
    /dev/stdout {
      # Log everything to the container's standard output so 'docker logs' works.
      default = 1
      ike = 2
      knl = 2
      cfg = 2
    }
  }

  # Allow older IKEv1 and IKEv2 algorithms if needed for compatibility.
  # For a modern provider like Oracle, this is not strictly necessary but is safe to include.
  # ietf_proposal_add_all = no

  # If the daemon is behind a NAT, it needs to know to send keep-alives.
  # Your container is in host mode, so this isn't strictly needed, but it doesn't hurt.
  nat_traversal = yes

  # If the daemon is behind a NAT, it needs to know to send keep-alives.
  # Your container is in host mode, so this isn't strictly needed, but it doesn't hurt.
  nat_traversal = yes

  # Plugin settings

  # Plugin settings
  plugins {
    # The duplicheck plugin provides an advanced but very specialized peer
    # identity duplicate checking. It works independent from the ipsec.conf
    # uniqueids feature.
    duplicheck {
      enable = yes
    }
  }
}

# Include additional configuration files.
# This allows entrypoint.sh to write dynamic settings without modifying this file.
include /etc/strongswan.d/*.conf
